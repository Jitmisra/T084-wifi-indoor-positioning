[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indoorloc"
version = "0.1.0"
description = "Wi-Fi fingerprinting indoor positioning on UJIIndoorLoc: building, floor and position prediction with kNN, Random Forest and XGBoost (Phase 1)."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gauri Mehrotra", email = "gauri.mehrotra2024@nst.rishihood.edu.in" },
    { name = "Ansh", email = "ansh.2024@nst.rishihood.edu.in" },
    { name = "Agnik Misra", email = "agnik.misra2024@nst.rishihood.edu.in" },
    { name = "Kartikey Gupta", email = "kartikey.2024@nst.rishihood.edu.in" },
    { name = "Lokendra Singh", email = "lokendra.singh2024@nst.rishihood.edu.in" },
]
keywords = ["indoor positioning", "wi-fi fingerprinting", "UJIIndoorLoc", "machine learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Mirrors requirements.txt (keep both files in sync). Exact versions behind results/:
# requirements-lock.txt (Python 3.14.3).
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    "matplotlib>=3.9",
    # tools for `make test` and `make notebooks`
    "pytest>=8.0",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
# Code-style tools used for this repository (configured below): pip install -e ".[dev]"
dev = ["ruff==0.15.8", "black==26.3.1"]

[project.urls]
Repository = "https://github.com/Jitmisra/T084-wifi-indoor-positioning"
Dataset = "https://archive.ics.uci.edu/dataset/310/ujiindoorloc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest` import the package from src/ even without `pip install -e .`.
pythonpath = ["src"]
addopts = "-ra"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
